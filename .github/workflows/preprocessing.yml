name: Preprocessing Otomatis

on:
  push:
    branches: [main]
    paths:
      - "influencer_marketing_roi_raw/**"
      - "preprocessing/automate_Kalyca-Venezia.py"
      - ".github/workflows/preprocessing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Env
        run: |
          python --version
          pip --version
          ls -la influencer_marketing_roi_raw

      - name: Install dependencies
        run: python -m pip install pandas==2.3.3 numpy==2.5.4 scikit-learn==1.9.1 joblib

      - name: Run preprocessing
        run: python preprocessing/automate_Kalyca-Venezia.py

      - name: Upload dataset hasil preprocessing
        uses: actions/upload-artifact@v7
        with:
          name: influencer-marketing-roi-preprocessing
          path: preprocessing/influencer_marketing_roi_preprocessing/
          if-no-files-found: error

      - name: Commit dataset terbaru ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preprocessing/influencer_marketing_roi_preprocessing
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada dataset hasil preprocessing."
          else
            git commit -m "CI: perbarui dataset hasil preprocessing"
            git push
          fi
